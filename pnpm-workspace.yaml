packages:
  - "docs"
  - "packages/*"

tasks:
  dev:
    cache: false

  build:
    dependsOn:
      - ^build
    outputs:
      - dist/**

  test:
    dependsOn:
      - ^test

  type-check:
    dependsOn:
      - ^type-check

  format:
    cache: true
    dependsOn:
      - ^format

overrides:
  tar: "^7.5.21"
  mdast-util-to-hast: "^13.2.1"
  vite: "^7.3.5"
  glob: "^10.5.0"
  js-yaml: ^4.2.0

allowBuilds:
  esbuild: true
